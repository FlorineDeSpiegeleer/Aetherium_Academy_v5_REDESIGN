<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Florine - Aetherium</title><link rel="stylesheet" href="../assets/style.css"></head><body>
<div class="wrap"><div class="panel phone-secret">
<div class="player-banner"><img src="../assets/florine_portrait.jpg"><div><div class="icon">🔮</div><h1>Florine</h1><p class="muted">Echo Sight</p></div></div>
<div id="content"></div></div></div>
<script>
const phase=new URLSearchParams(location.search).get("phase")||"1";
const DATA={
"1":{title:"Een echo trekt je aandacht",text:"Voor \u00e9\u00e9n hartslag staat het observatorium weer vol leven. Je hoort Veyne zeggen: \u201cJe hebt de uitlijning veranderd.\u201d Daarna: drie klokslagen \u2014 maar het geluid voelt vreemd vertraagd.",options:[["Volg vooral de stem in het visioen", "F1-A"], ["Probeer de emotie van Veyne te voelen", "F1-B"], ["Focus op het ritme van de klokslagen", "F1-C"]]},
"2":{title:"Een privékeuze",text:"Je hoeft niet te kiezen wie je 'leuk' vindt. Kies wie je instinctief vertrouwt wanneer het spannend wordt.",options:[["Rowan", "F2-R"], ["Kestrel", "F2-K"], ["Maeve", "F2-M"], ["Elias", "F2-E"]]},
"3":{title:"De sterrentrap",text:"Je ziet een korte echo van een figuur die iets kleins en krijtachtigs van een handschoen veegt. Het beeld is te gebroken om een gezicht te zien.",options:[["Volg de echo tot ze breekt", "F3-A"], ["Zoek naar een herkenbaar geluid", "F3-B"], ["Stop en onthoud enkel de beweging", "F3-C"]]}
};
function render(){
 const x=DATA[phase],el=document.getElementById("content");
 el.innerHTML=`<h2>${x.title}</h2><div class="notice">${x.text}</div><p><strong>Dit is persoonlijk.</strong> Jij beslist zelf of je het later deelt.</p><div class="phone-choice-list">${x.options.map(o=>`<button class="choice" onclick="finish('${o[1]}')">${o[0]}</button>`).join("")}</div>`;
}
function finish(code){
 localStorage.setItem("aetherium_florine_phase"+phase,code);
 document.getElementById("content").innerHTML=`<div class="center"><h2>Klaar</h2><p>Voer alleen deze code in op het projectorscherm.</p><div class="bigcode"><strong>${code}</strong></div><p class="muted">Wat je hebt gelezen blijft van jou, tenzij jij ervoor kiest het te delen.</p></div>`;
}
render();
</script></body></html>
